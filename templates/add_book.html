{% extends "base.html" %}

{% block title %}Добавить книгу{% endblock %}

{% block content %}
<h2>Добавить новую книгу</h2>

<form class="add-form" action="#" method="post">
    <div class="form-group">
        <label for="title">Название *</label>
        <input type="text" id="title" name="title" required placeholder="Введите название">
    </div>

    <div class="form-group">
        <label for="author">Автор *</label>
        <input type="text" id="author" name="author" required placeholder="Имя автора">
    </div>

    <div class="form-group">
        <label for="year">Год издания</label>
        <input type="number" id="year" name="year" min="1000" max="2099" placeholder="Например, 2010">
    </div>

    <div class="form-group">
        <label for="genre">Жанр</label>
        <select id="genre" name="genre">
            <option value="">Выберите жанр</option>
            <option value="roman">Роман</option>
            <option value="fantasy">Фэнтези</option>
            <option value="science">Научная фантастика</option>
            <option value="detective">Детектив</option>
            <option value="poetry">Поэзия</option>
            <option value="other">Другое</option>
        </select>
    </div>

    <div class="form-group">
        <label for="description">Краткое описание</label>
        <textarea id="description" name="description" rows="4" placeholder="О чём эта книга?"></textarea>
    </div>

    <button type="submit" class="btn-submit">Добавить книгу</button>
</form>
{% endblock %}
