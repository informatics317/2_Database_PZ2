<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека книг{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="container">
            <h1>Библиотека</h1>
            <nav class="menu">
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('add_book') }}">Добавить книгу</a>
                <a href="{{ url_for('about') }}">О проекте</a>
                <a href="{{ url_for('changelog') }}">Лог изменений</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
